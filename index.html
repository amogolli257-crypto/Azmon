<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff176f">
<meta name="description" content="GL Graphy - Thai GL Quiz">
<title>GL Graphy 💗</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --pink:#ff176f;
    --pink-light:#ff72aa;
    --red:#ff1744;
    --bg:#090107;
    --card:rgba(255,255,255,.07);
    --border:rgba(255,82,145,.32);
    --text:#fff;
    --muted:#dcb8c7;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:var(--text);
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,23,111,.27),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(255,23,68,.24),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #080106,
            #20040e 50%,
            #080106
        );

    overflow-x:hidden;
}

body::before,
body::after{
    content:"";
    position:fixed;
    width:380px;
    height:380px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.28;
    z-index:-1;
    pointer-events:none;
    animation:floatGlow 10s ease-in-out infinite alternate;
}

body::before{
    background:#ff176f;
    top:-160px;
    left:-130px;
}

body::after{
    background:#ff1744;
    right:-140px;
    bottom:-160px;
    animation-delay:2s;
}

@keyframes floatGlow{
    from{
        transform:translate(0,0) scale(1);
    }

    to{
        transform:translate(80px,60px) scale(1.25);
    }
}

.app{
    width:min(900px,94%);
    margin:auto;
    padding:25px 0 40px;
}

header{
    text-align:center;
    margin-bottom:24px;
}

.logo{
    font-size:clamp(45px,10vw,78px);
    font-weight:1000;
    letter-spacing:2px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff72aa,
            #ff1744,
            #fff
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        logoGradient 4s linear infinite,
        logoFloat 3s ease-in-out infinite;

    filter:
        drop-shadow(0 0 8px rgba(255,23,111,.8))
        drop-shadow(0 0 25px rgba(255,23,111,.5));
}

@keyframes logoGradient{
    to{
        background-position:300% center;
    }
}

@keyframes logoFloat{
    50%{
        transform:translateY(-5px);
    }
}

.subtitle{
    margin-top:4px;
    color:#ffd5e4;
    font-size:14px;
    font-weight:700;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:27px;
    padding:28px;

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 0 35px rgba(255,40,120,.025),
        0 0 30px rgba(255,23,111,.08);
}

.screen{
    display:none;
}

.screen.active{
    display:block;
    animation:screenIn .5s ease both;
}

@keyframes screenIn{
    from{
        opacity:0;
        transform:translateY(24px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}


/* =========================
   WELCOME
========================= */

#welcomeScreen{
    text-align:center;
    padding:50px 28px;
}

.welcome-heart{
    display:block;
    font-size:65px;
    margin-bottom:12px;
    animation:heartBeat 1.6s infinite;
}

@keyframes heartBeat{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }
}

.welcome-title{
    font-size:clamp(28px,6vw,43px);
    font-weight:950;
    margin-bottom:12px;
}

.welcome-description{
    color:var(--muted);
    line-height:1.9;
    margin-bottom:28px;
}

.name-label{
    display:block;
    text-align:right;
    color:#ffd7e6;
    font-weight:800;
    margin-bottom:8px;
}

.name-input{
    width:100%;
    height:56px;

    border-radius:15px;
    border:1px solid rgba(255,92,154,.4);

    background:rgba(0,0,0,.25);
    color:white;

    outline:none;
    padding:0 17px;

    font-size:16px;

    direction:rtl;

    transition:.25s;
}

.name-input:focus{
    border-color:var(--pink);

    box-shadow:
        0 0 0 3px rgba(255,23,111,.12),
        0 0 22px rgba(255,23,111,.25);
}

.name-input::placeholder{
    color:#9f7887;
}

.error{
    min-height:22px;
    margin-top:8px;
    color:#ff8cae;
    font-size:13px;
}

.primary-btn{
    width:100%;
    min-height:57px;

    margin-top:17px;

    border:none;
    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #ff176f,
            #ff1744
        );

    color:white;

    font-size:17px;
    font-weight:950;

    cursor:pointer;

    box-shadow:
        0 9px 27px rgba(255,23,111,.32),
        inset 0 1px rgba(255,255,255,.25);

    transition:.25s;
}

.primary-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 13px 32px rgba(255,23,111,.45),
        0 0 22px rgba(255,23,111,.22);
}

.primary-btn:active{
    transform:scale(.98);
}


/* =========================
   QUIZ
========================= */

.quiz-top{
    margin-bottom:23px;
}

.question-count{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:11px;

    color:#ffc7da;
    font-weight:850;
}

.progress-track{
    width:100%;
    height:9px;

    border-radius:99px;

    overflow:hidden;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.06);
}

.progress-bar{
    height:100%;
    width:0;

    border-radius:99px;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #ff176f,
            #ff79af
        );

    box-shadow:
        0 0 16px rgba(255,23,111,.65);

    transition:width .45s ease;
}

.question-box{
    margin-bottom:23px;
}

.question-number{
    color:#ff78a9;
    font-size:14px;
    font-weight:950;
    margin-bottom:11px;
}

.question-text{
    font-size:clamp(20px,4vw,28px);
    line-height:1.75;
    font-weight:900;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    position:relative;

    width:100%;
    min-height:63px;

    display:flex;
    align-items:center;

    gap:13px;

    padding:14px 16px;

    border:1px solid rgba(255,92,154,.24);
    border-radius:17px;

    background:rgba(255,255,255,.045);

    color:white;

    cursor:pointer;

    text-align:right;

    font-size:16px;
    line-height:1.65;

    transition:
        transform .2s,
        border .2s,
        background .2s,
        box-shadow .2s;
}

.option:hover{
    transform:translateX(-3px);

    border-color:
        rgba(255,92,154,.65);

    background:
        rgba(255,23,111,.08);
}

.option.selected{
    border-color:#ff4c8f;

    background:
        linear-gradient(
            100deg,
            rgba(255,23,111,.19),
            rgba(255,23,68,.07)
        );

    box-shadow:
        0 0 0 2px rgba(255,23,111,.08),
        0 0 22px rgba(255,23,111,.17);
}

.option-letter{
    flex:0 0 36px;

    width:36px;
    height:36px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.09);

    color:#ffc0d7;

    font-weight:950;
}

.option.selected .option-letter{
    background:
        linear-gradient(
            135deg,
            #ff176f,
            #ff1744
        );

    color:white;

    box-shadow:
        0 0 15px rgba(255,23,111,.35);
}

.quiz-bottom{
    display:flex;
    justify-content:flex-end;

    margin-top:25px;
}

.next-btn{
    min-width:155px;
    min-height:53px;

    border:none;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #ff176f,
            #ff1744
        );

    color:white;

    font-weight:950;
    font-size:16px;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 8px 25px rgba(255,23,111,.25);
}

.next-btn:hover:not(:disabled){
    transform:translateY(-2px);
}

.next-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
    box-shadow:none;
}


/* =========================
   RESULT
========================= */

#resultScreen{
    text-align:center;
    padding:45px 28px;
}

.result-icon{
    display:block;
    font-size:70px;
    margin-bottom:10px;
}

.result-title{
    font-size:clamp(28px,6vw,43px);
    font-weight:1000;
    margin-bottom:20px;
}

.result-name{
    color:#ffd4e3;
    font-size:18px;
    margin-bottom:9px;
}

.result-score{
    font-size:clamp(65px,15vw,110px);
    line-height:1;

    font-weight:1000;

    margin:13px 0 18px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #ff74ac,
            #ff1744
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    filter:
        drop-shadow(
            0 0 20px rgba(255,23,111,.45)
        );
}

.result-label{
    color:#ffc1d6;
    font-weight:850;
}

.screenshot-message{
    margin-top:25px;

    padding:17px;

    border-radius:15px;

    background:
        rgba(255,23,111,.08);

    border:
        1px solid rgba(255,92,154,.22);

    color:#ffd9e7;

    font-weight:750;

    line-height:1.8;
}

.perfect{
    display:none;

    margin-top:22px;

    font-size:26px;

    font-weight:1000;

    color:#ffd3e2;

    text-shadow:
        0 0 8px #ff176f,
        0 0 22px #ff176f;

    animation:
        perfectPulse .8s ease-in-out infinite alternate,
        perfectPop .6s ease both;
}

.perfect.show{
    display:block;
}

@keyframes perfectPulse{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.07);
    }
}

@keyframes perfectPop{
    from{
        opacity:0;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =========================
   CONFETTI
========================= */

.confetti-container{
    pointer-events:none;

    position:fixed;
    inset:0;

    overflow:hidden;

    z-index:50;

    display:none;
}

.confetti-container.show{
    display:block;
}

.confetti{
    position:absolute;

    top:-25px;

    width:8px;
    height:15px;

    border-radius:2px;

    background:#ff5c9a;

    animation:
        confettiFall 3s linear forwards;
}

@keyframes confettiFall{
    to{
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}

footer{
    text-align:center;

    margin-top:18px;

    color:#815b6b;

    font-size:12px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .app{
        width:94%;
        padding-top:17px;
    }

    .card{
        padding:19px;
        border-radius:21px;
    }

    #welcomeScreen,
    #resultScreen{
        padding:35px 19px;
    }

    .question-text{
        line-height:1.65;
    }

    .option{
        min-height:58px;
        padding:12px;
        font-size:14px;
    }

    .option-letter{
        flex-basis:32px;
        width:32px;
        height:32px;
    }

    .quiz-bottom{
        display:block;
    }

    .next-btn{
        width:100%;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}

</style>
</head>


<body>


<div
    class="confetti-container"
    id="confetti"
></div>


<div class="app">


<header>

    <div class="logo">
        GL Graphy
    </div>

    <div class="subtitle">
        این صفحه را اسکرین‌شات بگیرید و برای ادمین بفرستید 📸
    </div>

</header>


<main class="card">


<!-- =========================
     WELCOME
========================= -->

<section
    id="welcomeScreen"
    class="screen active"
>

    <span class="welcome-heart">
        💗
    </span>

    <h1 class="welcome-title">
        Welcome to GL Graphy 💗
    </h1>

    <p class="welcome-description">
        آماده‌ای میزان اطلاعاتت درباره Thai GL رو امتحان کنی؟ ✨
    </p>

    </label>

    >

    <div
        id="nameError"

    ></div>

    <button
        id="startBtn"
        class="primary-btn"
        type="button"
    >
        شروع آزمون ✨
    </button>

</section>


<!-- =========================
     QUIZ
========================= -->

<section
    id="quizScreen"
    class="screen"
>

    <div class="quiz-top">

        <div class="question-count">

            <span id="questionCounter">
                Question 1 / 26
            </span>

        </div>

        <div class="progress-track">

            <div
                id="progressBar"
                class="progress-bar"
            ></div>

        </div>

    </div>


    <div class="question-box">

        <div
            id="questionNumber"

        </button>

    </div>

</section>


<!-- =========================
     RESULT
========================= -->

<section
    id="resultScreen"
    class="screen"
>

    <span class="result-icon">
        🎉
    </span>

    <h2 class="result-title">
        🎉 آزمون به پایان رسید!
    </h2>

    <div class="result-name">
        GL Graphy 💗
    </div>

    <div
        id="resultUserName"
        class="result-name"
    ></div>

    <div class="result-label">
        امتیاز:
    </div>

    <div
        id="resultScore"
        class="result-score"
    >
        10%
    </div>

    <div
        id="perfectMessage"
        class="perfect"
    >
        PERFECT! 👑💗
    </div>

    <div class="screenshot-message">
        این صفحه را اسکرین‌شات بگیرید و برای ادمین بفرستید 📸❤️
    </div>

</section>


</main>


<footer>
    GL Graphy 💗
</footer>


</div>


<script>

"use strict";

   TOTAL QUESTIONS = 26

   پاسخ صحیح مستقیماً به صورت answer: 0/1

{
    number:"³",

    options:[
        "دوتا",
        "سه‌تا",

    ],
    answerHash:"3d8153"
},

{
    number:"⁴",
    text:"دلیل جدایی فای و یوکو چی بود؟؟",
    options:[
        "بخاطر اینکه یوکو فای ایگنور کرد و از کمپانی بیرون نیومد و جواب فای رو نداد چنین چیزی شبیه همین",
        "به دلیل تغییر کشور محل زندگی",
        "به دلیل پایان فیلمبرداری یک سریال",
        "به دلیل اختلاف در انتخاب نقش"
    ],
    answerHash:"5fad8a"
},

{
    number:"⁵",
    text:"اسم دو کارکتر نقش اصلی سریال گپ رو نام ببر؟؟",
    options:[
        "فرین بکی",
        "انگفا شارلوت",
        "فای یوکو",
        "نامتان فیلم"

    answerHash:"97373d"
},

{
    number:"⁶",
    text:"کدوم سریال از کاپل فرین بکی هست که داره تاریخ ساخت عقب میوفته اسم سریال رو بگو؟؟",

        "کرانیوم",

    ],
    answerHash:"ebe06d"

{

    ],
    answerHash:"1bc1d1"

{
    number:"⁸",
    text:"یک بازیگر جی ال نام ببر که توی میس گرند هم نقش ایفا کرده؟؟",

{

    options:[
        "فای / آیس/ لنا/ لینگ لینگ / فرین",
        "فقط بکی و جینا",
        "فقط پنگجی و جینا",
        "فقط شارلوت و بکی"
    ],
    answerHash:"5ecadb"
},

{
    number:"¹¹",
    text:"یک سریال جی ال رو نام ببرین که بیشترین قسمت رو داشته؟؟",
    options:[
        "رویال پین",
        "GAP",
        "Pluto",
        "Uranus 2324"
    ],
    answerHash:"b18abd"
},

{
    number:"¹²",
    text:"چند تا بازیگر جی ال نام ببرید که در سریالش سیگار کشیدن؟؟(دو یا سه مورد کافیه)",
    options:[
        "امی/ ویو/ نامتان",
        "فقط فرین",
        "فقط بکی",
        "فقط انگفا"
    ],
    answerHash:"79515d"
},

{
    number:"¹⁶",
    text:"در سریال های جی ال تایلندی چند شخصیت پزشک  داشتیم نام ببر؟؟",
    options:[
        "جینی/ لینگ لینگ/ امی/",
        "فرین/ بکی/ انگفا",
        "فای/ یوکو/ شارلوت",
        "فقط جینا"
    ],
    answerHash:"d816d8"
},

{
    number:"سؤال بعدی",
    text:"کدام کاپل جی‌ال باهم در یک سریال بودن ولی نقش هردو استریت بود؟",
    options:[
        "نامتان‌فیلم",

/* =====================================================
   HASH FUNCTION
===================================================== */

function makeHash(text){

    let h1 = 2166136261;
    let h2 = 16777619;

    const normalized =
        String(text)
        .trim()
        .normalize("NFKC");

    for(
        let i = 0;
        i < normalized.length;
        i++
    ){

        const c =
            normalized.charCodeAt(i);

        h1 ^= c;

        h1 =
            Math.imul(
                h1,
                16777619
            );

        h1 >>>= 0;

        h2 ^= c + i;

        h2 =
            Math.imul(
                h2,
                2246822519
            );

        h2 >>>= 0;
    }

    return (
        h1.toString(16) +
        h2.toString(16)
    ).slice(0,6);
}


/* =====================================================
   DOM
===================================================== */

const welcomeScreen =
    document.getElementById("welcomeScreen");

const quizScreen =
    document.getElementById("quizScreen");

const resultScreen =
    document.getElementById("resultScreen");

const nameInput =
    document.getElementById("nameInput");

const nameError =
    document.getElementById("nameError");

const startBtn =
    document.getElementById("startBtn");

const questionCounter =
    document.getElementById("questionCounter");

const questionNumber =
    document.getElementById("questionNumber");

const questionText =
    document.getElementById("questionText");

const optionsContainer =
    document.getElementById("options");

const nextBtn =
    document.getElementById("nextBtn");

const progressBar =
    document.getElementById("progressBar");

const resultUserName =
    document.getElementById("resultUserName");

const resultScore =
    document.getElementById("resultScore");

const perfectMessage =
    document.getElementById("perfectMessage");

const confetti =
    document.getElementById("confetti");


/* =====================================================
   STATE
===================================================== */

let currentQuestion = 0;

let userName = "";

let selectedAnswers =
    new Array(
        questions.length
    ).fill(null);


/* =====================================================
   SESSION STORAGE
===================================================== */

const STORAGE_KEY =
    "gl_graphy_quiz_state_v3";


function saveState(){

    const state = {

        userName:userName,

        currentQuestion:currentQuestion,

        selectedAnswers:selectedAnswers

    };

    try{

        sessionStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );

    }catch(error){

        console.warn(
            "Session storage unavailable."
        );
    }
}


function loadState(){

    try{

        const raw =
            sessionStorage.getItem(
                STORAGE_KEY
            );

        if(!raw){
            return false;
        }

        const state =
            JSON.parse(raw);

        if(
            !state ||
            typeof state !== "object"
        ){
            return false;
        }

        if(
            typeof state.userName === "string"
        ){

            userName =
                state.userName
                .slice(0,40);
        }

        if(
            Number.isInteger(
                state.currentQuestion
            ) &&
            state.currentQuestion >= 0 &&
            state.currentQuestion <
            questions.length
        ){

            currentQuestion =
                state.currentQuestion;
        }

        if(
            Array.isArray(
                state.selectedAnswers
            ) &&
            state.selectedAnswers.length ===
            questions.length
        ){

            selectedAnswers =
                state.selectedAnswers.map(
                    value =>
                        Number.isInteger(value)
                            ? value
                            : null
                );
        }

        return true;

    }catch(error){

        return false;
    }
}


function clearState(){

    try{

        sessionStorage.removeItem(
            STORAGE_KEY
        );

    }catch(error){}
}


/* =====================================================
   NAME SANITIZATION
===================================================== */

function sanitizeName(value){

    return String(value)

        .replace(
            /[\u0000-\u001F\u007F]/g,
            ""
        )

        .replace(
            /[<>]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim()

        .slice(0,40);
}


/* =====================================================
   SCREEN
===================================================== */

function showScreen(screen){

    [
        welcomeScreen,
        quizScreen,
        resultScreen
    ]
    .forEach(
        element =>
            element.classList.remove(
                "active"
            )
    );

    screen.classList.add(
        "active"
    );
}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

    const question =
        questions[currentQuestion];

    questionCounter.textContent =
        `Question ${
            currentQuestion + 1
        } / ${
            questions.length
        }`;

    questionNumber.textContent =
        question.number;

    questionText.textContent =
        question.text;

    optionsContainer.innerHTML =
        "";

    const previousAnswer =
        selectedAnswers[
            currentQuestion
        ];

    const letters =
        ["A","B","C","D"];

    question.options.forEach(
        (optionText,index)=>{

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "option";

            if(
                previousAnswer === index
            ){

                button.classList.add(
                    "selected"
                );
            }

            const letter =
                document.createElement(
                    "span"
                );

            letter.className =
                "option-letter";

            letter.textContent =
                letters[index];

            const text =
                document.createElement(
                    "span"
                );

            text.textContent =
                optionText;

            button.appendChild(
                letter
            );

            button.appendChild(
                text
            );

            button.addEventListener(
                "click",
                ()=>{
                    selectOption(index);
                }
            );

            optionsContainer.appendChild(
                button
            );
        }
    );

    updateNextButton();

    const progress =
        (
            (currentQuestion + 1) /
            questions.length
        ) * 100;

    progressBar.style.width =
        `${progress}%`;
}


/* =====================================================
   SELECT OPTION
===================================================== */

function selectOption(index){

    if(
        !Number.isInteger(index) ||
        index < 0 ||
        index >=
        questions[
            currentQuestion
        ].options.length
    ){
        return;
    }

    selectedAnswers[
        currentQuestion
    ] = index;

    const buttons =
        optionsContainer.querySelectorAll(
            ".option"
        );

    buttons.forEach(
        (button,i)=>{

            button.classList.toggle(
                "selected",
                i === index
            );
        }
    );

    updateNextButton();

    saveState();
}


/* =====================================================
   NEXT BUTTON
===================================================== */

function updateNextButton(){

    const selected =
        selectedAnswers[
            currentQuestion
        ];

    nextBtn.disabled =
        !Number.isInteger(selected);

    if(
        currentQuestion ===
        questions.length - 1
    ){

        nextBtn.textContent =
            "پایان آزمون 🏆";

    }else{

        nextBtn.textContent =
            "بعدی →";
    }
}


nextBtn.addEventListener(
    "click",
    ()=>{

        if(
            !Number.isInteger(
                selectedAnswers[
                    currentQuestion
                ]
            )
        ){
            return;
        }

        if(
            currentQuestion <
            questions.length - 1
        ){

            currentQuestion++;

            saveState();

            renderQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }else{

            finishQuiz();
        }
    }
);


/* =====================================================
   START
===================================================== */

startBtn.addEventListener(
    "click",
    ()=>{

        const cleaned =
            sanitizeName(
                nameInput.value
            );

        if(!cleaned){

            nameError.textContent =
                "لطفاً نام خود را وارد کنید.";

            nameInput.focus();

            return;
        }

        userName =
            cleaned;

        currentQuestion =
            0;

        selectedAnswers =
            new Array(
                questions.length
            ).fill(null);

        nameError.textContent =
            "";

        saveState();

        showScreen(
            quizScreen
        );

        renderQuestion();
    }
);


nameInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Enter"
        ){

            startBtn.click();
        }
    }
);


/* =====================================================
   SCORE
===================================================== */

function calculateScore(){

    let correct = 0;

    for(
        let i = 0;
        i < questions.length;
        i++
    ){

        const selectedIndex =
            selectedAnswers[i];

        if(
            !Number.isInteger(
                selectedIndex
            )
        ){
            continue;
        }

        const selectedText =
            questions[i]
            .options[
                selectedIndex
            ];

        const calculatedHash =
            makeHash(
                selectedText
            );

        if(
            calculatedHash ===
            questions[i].answerHash
        ){

            correct++;
        }
    }

    const rawPercentage =
        Math.round(
            (
                correct /
                questions.length
            ) * 100
        );

    return Math.max(
        10,
        rawPercentage
    );
}


/* =====================================================
   FINISH
===================================================== */

function finishQuiz(){

    const percentage =
        calculateScore();

    resultUserName.textContent =
        `نام کاربر: ${userName}`;

    resultScore.textContent =
        `${percentage}%`;

    if(
        percentage === 100
    ){

        perfectMessage.classList.add(
            "show"
        );

        launchConfetti();

    }else{

        perfectMessage.classList.remove(
            "show"
        );
    }

    /*
        هیچ پاسخ صحیحی در Storage ذخیره نشده.
        بعد از پایان، وضعیت موقت پاک می‌شود.
    */

    clearState();

    showScreen(
        resultScreen
    );

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   CONFETTI
===================================================== */

function launchConfetti(){

    confetti.innerHTML =
        "";

    confetti.classList.add(
        "show"
    );

    const pieces = 100;

    for(
        let i = 0;
        i < pieces;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );

        piece.className =
            "confetti";

        piece.style.left =
            `${
                Math.random() * 100
            }%`;

        piece.style.animationDelay =
            `${
                Math.random() * 1.2
            }s`;

        piece.style.animationDuration =
            `${
                2.2 +
                Math.random() * 2
            }s`;

        piece.style.transform =
            `rotate(${
                Math.random() * 360
            }deg)`;

        confetti.appendChild(
            piece
        );
    }

    setTimeout(
        ()=>{

            confetti.classList.remove(
                "show"
            );

            confetti.innerHTML =
                "";

        },
        5000
    );
}


/* =====================================================
   RESTORE SESSION
===================================================== */

(function restoreSession(){

    const restored =
        loadState();

    if(!restored){
        return;
    }

    if(userName){

        nameInput.value =
            userName;

        showScreen(
            quizScreen
        );

        renderQuestion();
    }

})();


/* =====================================================
   REFRESH PROTECTION
===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{

        if(
            quizScreen.classList.contains(
                "active"
            )
        ){

            saveState();
        }
    }
);


/* =====================================================
   END
===================================================== */

</script>

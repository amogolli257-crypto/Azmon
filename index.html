<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GL Graphy</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --pink:#ff2f92;
    --hot:#ff006e;
    --red:#d90429;
    --dark:#19000b;
    --glass:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.2);
    --text:#fff;
}

html,body{
    min-height:100%;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    color:var(--text);
    overflow-x:hidden;
    background:
        radial-gradient(circle at 15% 20%,rgba(255,0,110,.45),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(217,4,41,.5),transparent 32%),
        linear-gradient(135deg,#17000a,#4b0019,#160009);
}

/* Background particles */
.particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff;
    opacity:.5;
    box-shadow:0 0 15px #ff4fa3;
    animation:float 8s infinite ease-in-out;
}

.particle:nth-child(1){left:8%;top:20%;animation-delay:0s}
.particle:nth-child(2){left:18%;top:70%;animation-delay:2s}
.particle:nth-child(3){left:30%;top:40%;animation-delay:4s}
.particle:nth-child(4){left:44%;top:15%;animation-delay:1s}
.particle:nth-child(5){left:57%;top:75%;animation-delay:3s}
.particle:nth-child(6){left:70%;top:30%;animation-delay:5s}
.particle:nth-child(7){left:82%;top:60%;animation-delay:2s}
.particle:nth-child(8){left:93%;top:15%;animation-delay:4s}
.particle:nth-child(9){left:52%;top:48%;animation-delay:1s}
.particle:nth-child(10){left:12%;top:90%;animation-delay:5s}
.particle:nth-child(11){left:88%;top:88%;animation-delay:3s}
.particle:nth-child(12){left:38%;top:90%;animation-delay:6s}

@keyframes float{
    0%,100%{transform:translateY(0) scale(1);opacity:.25}
    50%{transform:translateY(-35px) scale(1.6);opacity:.8}
}

.container{
    position:relative;
    z-index:1;
    width:min(920px,94%);
    margin:auto;
    padding:25px 0 40px;
}

/* Header */
.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    font-size:clamp(42px,10vw,78px);
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(90deg,#fff,#ff8bc4,#ff167f,#fff);
    background-size:250%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:
        logoGlow 3s infinite alternate,
        gradientMove 5s linear infinite;
}

@keyframes logoGlow{
    from{filter:drop-shadow(0 0 8px #ff2f92)}
    to{filter:drop-shadow(0 0 28px #ff006e)}
}

@keyframes gradientMove{
    from{background-position:0%}
    to{background-position:250%}
}

.subtitle{
    margin-top:8px;
    font-size:clamp(13px,3vw,18px);
    color:#ffd8e9;
}

/* Screens */
.screen{
    display:none;
    animation:screenIn .55s ease;
}

.screen.active{
    display:block;
}

@keyframes screenIn{
    from{
        opacity:0;
        transform:translateY(20px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Glass card */
.glass{
    background:linear-gradient(
        135deg,
        rgba(255,255,255,.13),
        rgba(255,255,255,.045)
    );
    border:1px solid var(--border);
    border-radius:28px;
    padding:30px;
    box-shadow:
        0 20px 70px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.15),
        0 0 35px rgba(255,0,110,.12);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

/* Start */
.start-card{
    max-width:650px;
    margin:35px auto;
    text-align:center;
}

.start-title{
    font-size:clamp(27px,6vw,42px);
    margin-bottom:14px;
    color:#fff;
    text-shadow:0 0 20px rgba(255,47,146,.8);
}

.start-text{
    color:#ffd6e7;
    margin-bottom:25px;
    line-height:2;
}

.name-input{
    width:100%;
    padding:17px 20px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.25);
    color:#fff;
    font-size:17px;
    outline:none;
    text-align:right;
    transition:.3s;
}

.name-input::placeholder{
    color:#d9aabd;
}

.name-input:focus{
    border-color:#ff4da0;
    box-shadow:0 0 20px rgba(255,47,146,.3);
}

/* Buttons */
.main-btn{
    width:100%;
    border:0;
    border-radius:16px;
    padding:16px 20px;
    margin-top:18px;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#ff006e,#d90429);
    box-shadow:0 8px 25px rgba(255,0,110,.3);
    transition:.25s;
}

.main-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 35px rgba(255,0,110,.5);
}

.main-btn:active{
    transform:scale(.98);
}

.main-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none;
}

/* Quiz */
.quiz-card{
    margin-top:15px;
}

.quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:17px;
}

.question-number{
    font-size:15px;
    color:#ffc8df;
    font-weight:bold;
}

.progress-wrap{
    height:9px;
    background:rgba(255,255,255,.1);
    border-radius:99px;
    overflow:hidden;
    margin-bottom:27px;
}

.progress{
    height:100%;
    width:4%;
    border-radius:99px;
    background:linear-gradient(90deg,#ff006e,#ff70b3);
    box-shadow:0 0 15px #ff167f;
    transition:width .45s ease;
}

.question{
    font-size:clamp(20px,4.5vw,29px);
    line-height:1.9;
    margin-bottom:25px;
    color:#fff;
}

.options{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.option{
    width:100%;
    padding:17px 18px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:17px;
    background:rgba(0,0,0,.19);
    color:#fff;
    font-size:16px;
    text-align:right;
    cursor:pointer;
    transition:.25s;
    line-height:1.7;
}

.option:hover{
    background:rgba(255,47,146,.12);
    border-color:rgba(255,100,170,.5);
    transform:translateX(-3px);
}

.option.selected{
    background:rgba(255,47,146,.25);
    border-color:#ff66ae;
    box-shadow:
        0 0 18px rgba(255,47,146,.28),
        inset 0 0 20px rgba(255,47,146,.08);
    transform:scale(1.01);
}

.next-area{
    margin-top:25px;
}

/* Result */
.result-card{
    text-align:center;
    margin:35px auto;
    max-width:650px;
}

.result-icon{
    font-size:65px;
    margin-bottom:10px;
    animation:trophy 1.5s infinite alternate;
}

@keyframes trophy{
    from{transform:translateY(0) rotate(-4deg)}
    to{transform:translateY(-10px) rotate(4deg)}
}

.result-title{
    font-size:clamp(27px,6vw,40px);
    margin-bottom:20px;
    text-shadow:0 0 20px rgba(255,47,146,.8);
}

.result-name{
    color:#ffcce1;
    font-size:18px;
    margin-bottom:15px;
}

.score{
    font-size:clamp(60px,15vw,100px);
    font-weight:900;
    background:linear-gradient(180deg,#fff,#ff63ad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,0,110,.5));
    margin:5px 0 18px;
}

.screenshot-msg{
    line-height:2;
    color:#ffd7e8;
    font-size:16px;
}

.perfect{
    display:none;
    font-size:24px;
    font-weight:bold;
    margin-top:18px;
    color:#fff;
    animation:perfectGlow 1s infinite alternate;
}

.perfect.show{
    display:block;
}

@keyframes perfectGlow{
    from{
        text-shadow:0 0 8px #ff2f92;
        transform:scale(1);
    }
    to{
        text-shadow:
            0 0 10px #fff,
            0 0 25px #ff2f92,
            0 0 45px #ff006e;
        transform:scale(1.06);
    }
}

/* Decorative hearts */
.heart{
    position:fixed;
    font-size:18px;
    pointer-events:none;
    opacity:.25;
    animation:heartFloat 10s linear infinite;
    z-index:0;
}

.h1{left:4%;bottom:-30px;animation-delay:1s}
.h2{left:91%;bottom:-30px;animation-delay:4s}
.h3{left:50%;bottom:-30px;animation-delay:7s}

@keyframes heartFloat{
    0%{transform:translateY(0) rotate(0);opacity:0}
    15%{opacity:.35}
    80%{opacity:.2}
    100%{transform:translateY(-110vh) rotate(180deg);opacity:0}
}

/* Mobile */
@media(max-width:600px){
    .container{
        width:92%;
        padding-top:15px;
    }

    .glass{
        padding:21px 17px;
        border-radius:22px;
    }

    .header{
        margin-bottom:14px;
    }

    .subtitle{
        line-height:1.8;
    }

    .quiz-top{
        margin-bottom:13px;
    }

    .question{
        font-size:19px;
        line-height:2;
    }

    .option{
        font-size:15px;
        padding:15px 13px;
    }

    .main-btn{
        font-size:16px;
    }
}
</style>
</head>

/*
    فقط وضعیت موقت آزمون نگهداری می‌شود.
    پاسخ صحیح داخل Storage ذخیره نمی‌شود.
*/
function saveSession(){
    sessionStorage.setItem(
        "gl_graphy_state",
        JSON.stringify({
            name:userName,
            currentQuestion:currentQuestion,
            answers:userAnswers
        })
    );
}

function clearSession(){
    sessionStorage.removeItem("gl_graphy_state");
}

function showScreen(screen){
    startScreen.classList.remove("active");
    quizScreen.classList.remove("active");
    resultScreen.classList.remove("active");

    screen.classList.add("active");
}

function sanitizeName(value){
    return value
        .replace(/[\u0000-\u001F\u007F]/g,"")
        .trim()
        .slice(0,40);
}

function renderQuestion(){

    const item = questions[currentQuestion];

    selectedAnswer =
        userAnswers[currentQuestion] !== undefined
            ? userAnswers[currentQuestion]
            : null;

    questionNumber.textContent =
        "Question " + (currentQuestion + 1) + " / " + questions.length;

    questionEl.textContent = item.q;

    optionsEl.innerHTML = "";

    item.options.forEach((text,index)=>{

        const button = document.createElement("button");

        button.type = "button";
        button.className = "option";
        button.textContent = text;

        if(selectedAnswer === index){
            button.classList.add("selected");
        }

        button.addEventListener("click",()=>{
            selectOption(index);
        });

        optionsEl.appendChild(button);
    });

    const percent =
        ((currentQuestion + 1) / questions.length) * 100;

    progress.style.width = percent + "%";

    nextBtn.disabled = selectedAnswer === null;

    if(currentQuestion === questions.length - 1){
        nextBtn.textContent = "پایان آزمون 🏆";
    }else{
        nextBtn.textContent = "بعدی →";
    }
}

function selectOption(index){

    selectedAnswer = index;
    userAnswers[currentQuestion] = index;

    const buttons =
        optionsEl.querySelectorAll(".option");

    buttons.forEach((button,i)=>{
        button.classList.toggle(
            "selected",
            i === index
        );
    });

    nextBtn.disabled = false;

    saveSession();
}

function calculateScore(){

    let correct = 0;

    for(let i=0;i<questions.length;i++){

        if(userAnswers[i] === questions[i].answer){
            correct++;
        }
    }

    let percentage =
        Math.round((correct / questions.length) * 100);

    if(percentage < 10){
        percentage = 10;
    }

    return {
        correct:correct,
        percentage:percentage
    };
}

function finishQuiz(){

    const result = calculateScore();

    /*
        فقط نتیجه نهایی نمایش داده می‌شود.
        هیچ جزئیاتی درباره سؤال‌های درست/غلط نمایش داده نمی‌شود.
    */

    resultName.textContent = userName;
    scoreEl.textContent = result.percentage + "%";

    if(result.correct === questions.length){
        perfectEl.classList.add("show");
        createPerfectParticles();
    }else{
        perfectEl.classList.remove("show");
    }

    showScreen(resultScreen);

    sessionStorage.setItem(
        "gl_graphy_finished",
        JSON.stringify({
            name:userName,
            score:result.percentage
        })
    );

    sessionStorage.removeItem("gl_graphy_state");
}

function createPerfectParticles(){

    for(let i=0;i<22;i++){

        const p = document.createElement("div");

        p.textContent =
            i % 2 === 0 ? "💗" : "✨";

        p.style.position = "fixed";
        p.style.left = Math.random()*100 + "vw";
        p.style.top = "-30px";
        p.style.fontSize =
            (14 + Math.random()*18) + "px";
        p.style.zIndex = "10";
        p.style.pointerEvents = "none";
        p.style.animation =
            "perfectFall " +
            (2 + Math.random()*3) +
            "s linear forwards";

        document.body.appendChild(p);

        setTimeout(()=>{
            p.remove();
        },5500);
    }
}

const style = document.createElement("style");

style.textContent = `
@keyframes perfectFall{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}
`;

document.head.appendChild(style);

startBtn.addEventListener("click",()=>{

    userName = sanitizeName(nameInput.value);

    if(!userName){
        nameInput.focus();
        nameInput.style.borderColor = "#ff167f";

        setTimeout(()=>{
            nameInput.style.borderColor = "";
        },700);

        return;
    }

    currentQuestion = 0;
    selectedAnswer = null;
    userAnswers = [];

    saveSession();

    showScreen(quizScreen);
    renderQuestion();
});

nameInput.addEventListener("keydown",(event)=>{
    if(event.key === "Enter"){
        startBtn.click();
    }
});

nextBtn.addEventListener("click",()=>{

    if(selectedAnswer === null){
        return;
    }

    /*
        هیچ بررسی درست/غلطی اینجا انجام نمی‌شود.
        فقط پاسخ انتخاب‌شده ذخیره موقت می‌شود.
    */

    if(currentQuestion < questions.length - 1){

        currentQuestion++;
        selectedAnswer =
            userAnswers[currentQuestion] !== undefined
                ? userAnswers[currentQuestion]
                : null;

        saveSession();
        renderQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        finishQuiz();
    }
});

/*
    بازیابی وضعیت موقت آزمون بعد از Refresh
*/
(function restoreSession(){

    try{

        const finished =
            sessionStorage.getItem("gl_graphy_finished");

        if(finished){

            const data = JSON.parse(finished);

            userName =
                typeof data.name === "string"
                    ? data.name
                    : "";

            resultName.textContent = userName;
            scoreEl.textContent =
                Number(data.score) + "%";

            if(Number(data.score) === 100){
                perfectEl.classList.add("show");
            }

            showScreen(resultScreen);
            return;
        }

        const saved =
            sessionStorage.getItem("gl_graphy_state");

        if(!saved){
            return;
        }

        const data = JSON.parse(saved);

        if(
            typeof data.name !== "string" ||
            !Array.isArray(data.answers)
        ){
            return;
        }

        userName = sanitizeName(data.name);

        currentQuestion =
            Math.max(
                0,
                Math.min(
                    Number(data.currentQuestion) || 0,
                    questions.length - 1
                )
            );

        userAnswers = data.answers;

        showScreen(quizScreen);
        renderQuestion();

    }catch(error){

        sessionStorage.removeItem("gl_graphy_state");
        sessionStorage.removeItem("gl_graphy_finished");
    }

})();
</script>
